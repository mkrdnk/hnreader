name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ github.ref_name }}

  release:
    name: Attach build to release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hnreader-*-x86_64
          merge-multiple: true
          path: dist

      - name: Verify all downloaded archives
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          for platform in fedora43 debian13 ubuntu24.04; do
            sha256sum --check "hnreader-${VERSION}-${platform}-x86_64.tar.gz.sha256"
          done

      - name: Create release or upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          assets=()
          for platform in fedora43 debian13 ubuntu24.04; do
            archive="dist/hnreader-${VERSION}-${platform}-x86_64.tar.gz"
            assets+=("$archive" "$archive.sha256")
          done
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$is_draft" != true ]]; then
              existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
              missing=()
              verification_dir=$(mktemp -d)
              trap 'rm -rf "$verification_dir"' EXIT
              for platform in fedora43 debian13 ubuntu24.04; do
                archive="hnreader-${VERSION}-${platform}-x86_64.tar.gz"
                pair_missing=()
                for file in "$archive" "$archive.sha256"; do
                  if ! grep -Fxq -- "$file" <<< "$existing"; then
                    pair_missing+=("dist/$file")
                  fi
                done
                if (( ${#pair_missing[@]} == 1 )); then
                  # Validate the existing file against its newly built counterpart.
                  for file in "$archive" "$archive.sha256"; do
                    if grep -Fxq -- "$file" <<< "$existing"; then
                      gh release download "$RELEASE_TAG" --pattern "$file" --dir "$verification_dir"
                    else
                      cp "dist/$file" "$verification_dir/$file"
                    fi
                  done
                  (cd "$verification_dir" && sha256sum --check "$archive.sha256")
                fi
                missing+=("${pair_missing[@]}")
              done
              if (( ${#missing[@]} > 0 )); then
                gh release upload "$RELEASE_TAG" "${missing[@]}"
              else
                echo "Release $RELEASE_TAG already has all build assets."
              fi
            else
              gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --draft --title "HN Reader $VERSION" --generate-notes
          fi
